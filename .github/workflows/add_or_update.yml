name: Add or update URL

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path part of the shortened URL"
        required: true
        type: string
      url:
        description: 'URL to shorten. Type "delete" to remove URL.'
        required: true
        type: string
      override:
        description: "Override (or delete) the URL mapping if it exists. Will throw an error otherwise."
        required: false
        type: boolean

jobs:
  edit:
    runs-on: ubuntu-latest
    name: Redirect ${{ inputs.path }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update config
        run: python3 validate_and_add.py "$INPUT_PATH" "$INPUT_URL" --override "$INPUT_OVERRIDE"
        env:
          INPUT_PATH: ${{ inputs.path }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_OVERRIDE: ${{ inputs.override }}
      - name: Commit
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "vercel.json"
          git commit -m 's: edit "$INPUT_PATH" redirect'
        env:
          INPUT_PATH: ${{ inputs.path }}
      - name: Push
        run: git push origin HEAD:refs/heads/main
